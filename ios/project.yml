# XcodeGen spec — the source of truth for the Xcode project. After pulling: `xcodegen` (from ios/).
# The generated AsthmaLog.xcodeproj, Info.plist and entitlements are not committed.
name: AsthmaLog
options:
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  AsthmaCore:
    path: AsthmaCore
targets:
  AsthmaLog:
    type: application
    platform: iOS
    sources:
      - AsthmaLog
      - Shared
      - QuickRecordActivity
      # Owner photos for onboarding; gitignored, so absent in fresh clones (the app falls back).
      - path: PrivateMedia
        optional: true
    dependencies:
      - package: AsthmaCore
      # The watch app ships inside the iPhone app.
      - target: AsthmaLogWatch
      # Lock Screen recorder (Live Activity) and the Voice note control.
      - target: AsthmaLogWidgets
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # App code runs on the main actor unless it opts out — fewer concurrency errors for UI code.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: AsthmaLog/Info.plist
      properties:
        CFBundleDisplayName: felt air
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Typefaces in AsthmaLog/Theme/Fonts/ (OFL). Filenames only — Xcode copies them to the bundle root.
        UIAppFonts:
          - Recursive.ttf
          - FunnelSans-Regular.ttf
          - FunnelSans-Medium.ttf
          - FunnelSans-SemiBold.ttf
          - FunnelSans-Bold.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: Your location stamps each inhaler log with the outdoor air and weather where you were.
        NSLocationAlwaysAndWhenInUseUsageDescription: Notes the places you spend time, on this iPhone, so felt air can compare your inhaler moments with ordinary hours where you actually were.
        NSMotionUsageDescription: Movement (walking, driving, still) helps guess whether you were indoors or outdoors.
        NSHealthUpdateUsageDescription: Saves each time you use your inhaler to Apple Health as Inhaler Usage.
        NSHealthShareUsageDescription: Reads your sleep, heart rate and breathing rate to describe how you were around each moment, in words. Stays on this iPhone.
        NSMicrophoneUsageDescription: Record a short voice note about how you're feeling.
        NSSpeechRecognitionUsageDescription: Turns your voice note into text on this iPhone.
        NSBluetoothAlwaysUsageDescription: Connects to your felt button so a press logs a moment, even when the app is closed.
        # audio: a voice note started from the Lock Screen keeps recording with the phone locked.
        UIBackgroundModes: [bluetooth-central, audio]
        NSSupportsLiveActivities: true
        # feltair://record/<moment id>: tapping the Lock Screen recorder opens the in-app one.
        CFBundleURLTypes:
          - CFBundleURLName: felt-air
            CFBundleURLSchemes: [feltair]
        OPENAQ_API_KEY: $(OPENAQ_API_KEY)
        AIRNOW_API_KEY: $(AIRNOW_API_KEY)
        AMBEE_API_KEY: $(AMBEE_API_KEY)
    entitlements:
      path: AsthmaLog/AsthmaLog.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []

  # Widget extension: the Quick Record Live Activity (Lock Screen + Dynamic Island) and the Voice note control.
  # Its buttons run App Intents in the app's process.
  AsthmaLogWidgets:
    type: app-extension
    platform: iOS
    sources:
      - AsthmaLogWidgets
      - QuickRecordActivity
      - path: AsthmaLog/Theme/Fonts/Recursive.ttf
        buildPhase: resources
    dependencies:
      - package: AsthmaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).asthmalog.widgets
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: AsthmaLogWidgets/Info.plist
      properties:
        CFBundleDisplayName: felt air
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts: [Recursive.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # felt air on Apple Watch: two buttons that log a moment (orange rescue, blue standard).
  AsthmaLogWatch:
    type: application
    platform: watchOS
    sources:
      - AsthmaLogWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).asthmalog.watchkitapp
        PRODUCT_NAME: AsthmaLogWatch
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: felt air
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).asthmalog
        SKIP_INSTALL: YES
